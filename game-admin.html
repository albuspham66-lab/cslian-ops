<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
body{background:#0f0a24;color:#e8e6f5;padding:24px}
h1{font-size:22px;margin-bottom:4px}
h2{font-size:16px;margin:24px 0 10px;color:#a29bfe}
.card{background:#1a1240;border:1px solid #2d2560;border-radius:10px;padding:16px;margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px;border-bottom:1px solid #2d2560;text-align:left}
th{color:#a29bfe;font-weight:600}
input,select,textarea{background:#0f0a24;border:1px solid #2d2560;color:#e8e6f5;padding:6px 10px;border-radius:6px;font-size:13px;margin:2px}
button{background:#6c5ce7;color:#fff;border:none;padding:7px 14px;border-radius:6px;cursor:pointer;font-size:13px;margin:2px}
button:hover{background:#4834d4}
button.danger{background:#ff7675}
button.danger:hover{background:#e84118}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:8px;cursor:pointer;background:#1a1240;border:1px solid #2d2560}
.tab.active{background:#6c5ce7}
.hidden{display:none}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.muted{color:#8a86b8;font-size:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:#2d2560}
.badge.open{background:#00b894}
.badge.closed{background:#636e72}
</style>
</head>

<div class="muted">Cấu hình 5 mini-game — chỉ dùng trong Hub, không public cho sale</div>

<div class="tabs">

  <div class="tab" data-tab="box" onclick="switchTab('box')">🎁 Hộp bí mật</div>

</div>

<div id="tab-contest" class="tabcontent"></div>
<div id="tab-ticket" class="tabcontent hidden"></div>
<div id="tab-wheel" class="tabcontent hidden"></div>
<div id="tab-box" class="tabcontent hidden"></div>
<div id="tab-auction" class="tabcontent hidden"></div>

const GAME_ACTION_URL=CRM_URL+'/functions/v1/game-action';

async function fRead(pathAndQuery){
  const res=await fetch(FIN_URL+'/rest/v1/'+pathAndQuery,{headers:{apikey:FIN_ANON,Authorization:'Bearer '+FIN_ANON}});
  return res.ok?await res.json():[];
}
async function fWrite(path,method,body){
  const res=await fetch(FIN_URL+'/rest/v1/'+path,{method:method,headers:{apikey:FIN_ANON,Authorization:'Bearer '+FIN_ANON,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(body)});
  return res.ok?await res.json():{error:await res.text()};
}
async function cRead(pathAndQuery){
  const res=await fetch(CRM_URL+'/rest/v1/'+pathAndQuery,{headers:{apikey:CRM_ANON,Authorization:'Bearer '+CRM_ANON}});
  return res.ok?await res.json():[];
}
async function cWrite(path,method,body){
  const res=await fetch(CRM_URL+'/rest/v1/'+path,{method:method,headers:{apikey:CRM_ANON,Authorization:'Bearer '+CRM_ANON,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(body)});
  return res.ok?await res.json():{error:await res.text()};
}
async function callAction(action,extra){
  const res=await fetch(GAME_ACTION_URL,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+CRM_ANON},body:JSON.stringify(Object.assign({action:action},extra||{}))});
  return await res.json();
}

let profilesCache=null;
async function getProfiles(){
  if(profilesCache)return profilesCache;
  profilesCache=await cRead('profiles?select=id,full_name,code,role&order=code');
  return profilesCache;
}
function profName(id,profiles){const p=(profiles||[]).find(function(x){return x.id===id;});return p?p.full_name+' ('+p.code+')':id;}

function switchTab(t){
  document.querySelectorAll('.tab').forEach(function(el){el.classList.toggle('active',el.dataset.tab===t);});
  document.querySelectorAll('.tabcontent').forEach(function(el){el.classList.add('hidden');});
  document.getElementById('tab-'+t).classList.remove('hidden');
  if(t==='contest')renderContest();
  if(t==='ticket')renderTicket();
  if(t==='wheel')renderWheel();
  if(t==='box')renderBox();
  if(t==='auction')renderAuction();
}

// ═══ 1. ĐUA XE ═══
const DEFAULT_TARGET_OFFICIAL=23500, DEFAULT_TARGET_PROBATION=18800;
const CONTEST_METRIC_LABELS={order_count:'Số đơn hàng',revenue:'Doanh số ($)',sku_qty:'Số lượng SP theo SKU'};
let contestPrizesDraft=[]; // dùng khi tạo contest mới — cấu hình phần thưởng trước khi tạo

async function renderContest(){
  const el=document.getElementById('tab-contest');
  el.innerHTML='Đang tải...';
  // Auto-đóng các contest quá hạn trước khi hiển thị (lazy-check, không có cron thật)
  await callAction('check_expired_contests',{});
  const [active,closed]=await Promise.all([
    fRead('contests?status=eq.active&order=id.desc'),
    fRead('contests?status=eq.closed&order=closed_at.desc&limit=20'),
  ]);

  el.innerHTML='<div class="card"><h2>Tạo Contest mới</h2>'
    +'<div class="row"><input id="ct-name" placeholder="Tên contest (VD: Đua ghế Pedicure Q3)"></div>'
    +'<div class="row"><label>Tiêu chí:</label><select id="ct-metric" onchange="onContestMetricChange()">'
    +Object.keys(CONTEST_METRIC_LABELS).map(function(k){return '<option value="'+k+'">'+CONTEST_METRIC_LABELS[k]+'</option>';}).join('')
    +'</select></div>'
    +'<div class="row" id="ct-sku-row" style="display:none"><label>Mã SKU bắt đầu bằng (cách nhau dấu phẩy):</label><input id="ct-sku-prefixes" placeholder="VD: PDC,PAC hoặc HEA" style="width:220px"></div>'
    +'<div class="row"><label>Cách xếp hạng:</label><select id="ct-ranking"><option value="absolute">Giá trị tuyệt đối cao nhất</option><option value="target_pct">% đạt target cá nhân (chỉ hợp lý với Doanh số, giả định theo tháng)</option></select></div>'
    +'<div class="row"><label>Từ ngày:</label><input id="ct-start" type="date"><label>Đến ngày (deadline):</label><input id="ct-end" type="date"></div>'
    +'<h3 style="margin-top:14px;font-size:13px;color:var(--text2)">Phần thưởng</h3>'
    +'<div id="ct-prizes-list"></div>'
    +'<button onclick="addContestPrizeRow()">+ Thêm mốc thưởng</button><br>'
    +'<button onclick="createContest()" style="margin-top:12px">Tạo Contest</button>'
    +'</div>'
    +'<div class="card"><h2>Đang chạy ('+active.length+')</h2>'
    +(active.length===0?'<div class="muted">Chưa có contest nào đang chạy</div>':active.map(renderContestActiveRow).join(''))
    +'</div>'
    +'<div class="card"><h2>Lịch sử đã đóng</h2>'
    +(closed.length===0?'<div class="muted">Chưa có contest nào kết thúc</div>':closed.map(renderContestClosedRow).join(''))
    +'</div>';
  contestPrizesDraft=[{rank_from:1,rank_to:1,prize_title:''}];
  renderContestPrizesList();
}
function onContestMetricChange(){
  const m=document.getElementById('ct-metric').value;
  document.getElementById('ct-sku-row').style.display=m==='sku_qty'?'flex':'none';
}
function renderContestPrizesList(){
  const el=document.getElementById('ct-prizes-list');
  if(!el)return;
  el.innerHTML=contestPrizesDraft.map(function(p,i){
    return '<div class="row">'
      +'<span class="muted">Hạng</span><input type="number" value="'+(p.rank_from||'')+'" style="width:50px" placeholder="từ" onchange="contestPrizesDraft['+i+'].rank_from=parseInt(this.value)||null">'
      +'<span class="muted">đến</span><input type="number" value="'+(p.rank_to||'')+'" style="width:50px" placeholder="đến" onchange="contestPrizesDraft['+i+'].rank_to=parseInt(this.value)||null">'
      +'<input placeholder="Tên phần thưởng" value="'+(p.prize_title||'')+'" onchange="contestPrizesDraft['+i+'].prize_title=this.value" style="width:200px">'
      +'<button class="danger" onclick="removeContestPrizeRow('+i+')">Xoá</button></div>';
  }).join('');
}
function addContestPrizeRow(){contestPrizesDraft.push({rank_from:null,rank_to:null,prize_title:''});renderContestPrizesList();}
function removeContestPrizeRow(i){contestPrizesDraft.splice(i,1);renderContestPrizesList();}

async function createContest(){
  const name=document.getElementById('ct-name').value;
  const metric=document.getElementById('ct-metric').value;
  const ranking=document.getElementById('ct-ranking').value;
  const start=document.getElementById('ct-start').value;
  const end=document.getElementById('ct-end').value;
  if(!name||!start||!end){alert('Nhập đủ tên + ngày bắt đầu/kết thúc');return;}
  const skuPrefixes=metric==='sku_qty'?document.getElementById('ct-sku-prefixes').value.split(',').map(function(s){return s.trim();}).filter(Boolean):null;
  if(metric==='sku_qty'&&(!skuPrefixes||skuPrefixes.length===0)){alert('Nhập ít nhất 1 mã SKU');return;}

  const created=await fWrite('contests','POST',{name:name,metric_type:metric,sku_prefixes:skuPrefixes,ranking_mode:ranking,start_date:start,end_date:end,status:'active'});
  if(!Array.isArray(created)||!created[0]){alert('Lỗi tạo contest');return;}
  const contestId=created[0].id;

  const prizeRows=contestPrizesDraft.filter(function(p){return p.prize_title;}).map(function(p){return {contest_id:contestId,rank_from:p.rank_from,rank_to:p.rank_to,prize_title:p.prize_title};});
  if(prizeRows.length>0)await fWrite('contest_prizes','POST',prizeRows);

  alert('Đã tạo Contest');renderContest();
}

function renderContestActiveRow(c){
  return '<div style="border-top:1px solid var(--border);padding:10px 0">'
    +'<b>'+c.name+'</b> <span class="muted">('+CONTEST_METRIC_LABELS[c.metric_type]+', '+c.start_date+' → '+c.end_date+')</span>'
    +'<div class="row" style="margin-top:6px">'
    +'<input type="date" id="ct-extend-'+c.id+'" value="'+c.end_date+'"><button onclick="extendContest('+c.id+')">Gia hạn</button>'
    +'<button onclick="viewContestLeaderboard('+c.id+')">Xem bảng xếp hạng</button>'
    +'<button class="danger" onclick="closeContestNow('+c.id+')">Đóng ngay</button>'
    +'</div><div id="ct-lb-'+c.id+'"></div></div>';
}
function renderContestClosedRow(c){
  return '<div style="border-top:1px solid var(--border);padding:10px 0">'
    +'<b>'+c.name+'</b> <span class="badge closed">Đã đóng '+(c.closed_at?c.closed_at.slice(0,10):'')+'</span>'
    +'<div class="row" style="margin-top:6px"><button onclick="viewContestResults('+c.id+')">Xem kết quả</button></div>'
    +'<div id="ct-res-'+c.id+'"></div></div>';
}
async function extendContest(contestId){
  const newEnd=document.getElementById('ct-extend-'+contestId).value;
  if(!newEnd){alert('Chọn ngày mới');return;}
  await fWrite('contests?id=eq.'+contestId,'PATCH',{end_date:newEnd});
  alert('Đã gia hạn');renderContest();
}
async function closeContestNow(contestId){
  if(!confirm('Đóng contest này ngay? Không thể mở lại.'))return;
  const res=await callAction('close_contest',{user_id:CALVIN_USER_ID,contest_id:contestId});
  if(!res.ok){alert(res.error||'Lỗi đóng contest');return;}
  alert('Đã đóng — '+res.results_count+' kết quả được lưu');
  renderContest();
}
async function viewContestLeaderboard(contestId){
  const el=document.getElementById('ct-lb-'+contestId);
  el.innerHTML='Đang tải...';
  const res=await callAction('get_contest_leaderboard',{contest_id:contestId});
  if(!res.ok){el.innerHTML='Lỗi tải bảng xếp hạng';return;}
  const profiles=await getProfiles();
  el.innerHTML='<table style="margin-top:6px"><tr><th>#</th><th>Sale</th><th>Giá trị</th></tr>'
    +res.board.map(function(b){return '<tr><td>'+b.rank+'</td><td>'+profName(b.user_id,profiles)+'</td><td>'+(res.contest.metric_type==='revenue'?'$':'')+b.value.toLocaleString()+(res.contest.ranking_mode==='target_pct'?' ('+Math.round(b.pct*10)/10+'%)':'')+'</td></tr>';}).join('')
    +'</table>';
}
async function viewContestResults(contestId){
  const el=document.getElementById('ct-res-'+contestId);
  el.innerHTML='Đang tải...';
  const results=await fRead('contest_results?contest_id=eq.'+contestId+'&order=rank');
  el.innerHTML='<table style="margin-top:6px"><tr><th>#</th><th>Sale</th><th>Giá trị</th><th>Phần thưởng</th></tr>'
    +results.map(function(r){return '<tr><td>'+r.rank+'</td><td>'+(r.full_name||r.user_id)+'</td><td>'+r.value_achieved.toLocaleString()+'</td><td>'+(r.prize_title||'—')+'</td></tr>';}).join('')
    +'</table>';
}

// ═══ 2. VÉ VÀNG ═══
async function renderTicket(){
  const el=document.getElementById('tab-ticket');
  el.innerHTML='Đang tải...';
  const [campaigns,pending,profiles]=await Promise.all([
    cRead('customers?select=campaign_name&campaign_name=not.is.null&limit=2000'),
    cRead('customers?is_golden_ticket=eq.true&lead_status=neq.Closedeal&select=id,business_name,customer_name,assigned_to,campaign_name'),
    getProfiles(),
  ]);
  const uniqueCampaigns=[...new Set(campaigns.map(function(c){return c.campaign_name;}))].filter(Boolean);

  el.innerHTML='<div class="card"><h2>Gắn vé vàng ngẫu nhiên cho 1 campaign</h2>'
    +'<div class="row"><select id="ticket-campaign"><option value="">-- Chọn campaign --</option>'+uniqueCampaigns.map(function(c){return '<option value="'+c+'">'+c+'</option>';}).join('')+'</select>'
    +'<label>Tỷ lệ %:</label><input id="ticket-pct" type="number" value="5" style="width:60px">'
    +'<button onclick="assignGoldenTickets()">Gắn cờ ngẫu nhiên</button></div>'
    +'<div class="muted">Sẽ random chọn đúng % khách CHƯA có cờ trong campaign này để gắn is_golden_ticket=true</div></div>'
    +'<div class="card"><h2>Vé vàng đang chờ chốt ('+pending.length+')</h2><table><tr><th>Khách hàng</th><th>Sale</th><th>Campaign</th></tr>'
    +pending.map(function(c){return '<tr><td>'+(c.business_name||c.customer_name||'#'+c.id)+'</td><td>'+profName(c.assigned_to,profiles)+'</td><td>'+(c.campaign_name||'')+'</td></tr>';}).join('')
    +'</table></div>';
}
async function assignGoldenTickets(){
  const campaign=document.getElementById('ticket-campaign').value;
  const pct=parseFloat(document.getElementById('ticket-pct').value)||5;
  if(!campaign){alert('Chọn campaign trước');return;}
  const custs=await cRead('customers?campaign_name=eq.'+encodeURIComponent(campaign)+'&is_golden_ticket=eq.false&select=id&limit=2000');
  if(custs.length===0){alert('Không có khách nào để gắn cờ');return;}
  const n=Math.max(1,Math.round(custs.length*pct/100));
  const shuffled=custs.sort(function(){return Math.random()-0.5;}).slice(0,n);
  // 1 lệnh PATCH duy nhất (id IN (...)) thay vì lặp từng khách — cùng giá trị is_golden_ticket:true cho tất cả
  await cWrite('customers?id=in.('+shuffled.map(function(c){return c.id;}).join(',')+')','PATCH',{is_golden_ticket:true});
  alert('Đã gắn vé vàng cho '+shuffled.length+'/'+custs.length+' khách');
  renderTicket();
}

// ═══ 3. VÒNG QUAY ═══
const METRIC_OPTIONS=[
  {value:'calls_answered',label:'Số cuộc "Bắt máy" thành công'},
  {value:'orders_closed',label:'Số đơn chốt'},
  {value:'revenue_amount',label:'Doanh số ($)'},
];
let wheelRulesDraft=[]; // state tạm khi đang chỉnh sửa rule trong tab này

async function renderWheel(){
  const el=document.getElementById('tab-wheel');
  el.innerHTML='Đang tải...';
  const [sessions,configs]=await Promise.all([
    fRead('wheel_sessions?is_sale_game=eq.true&order=id.desc&limit=1'),
    fRead('game_wheel_config?is_active=eq.true&limit=1'),
  ]);
  const session=sessions[0];
  const entries=session?await fRead('wheel_entries?session_id=eq.'+session.id+'&order=sort_order'):[];
  const cfg=configs[0];
  wheelRulesDraft=(cfg&&cfg.metric_rules&&cfg.metric_rules.length)?cfg.metric_rules.slice():[{metric:'calls_answered',per_unit:10,credits:1}];

  el.innerHTML='<div class="card"><h2>Điều kiện nhận lượt quay — tuỳ chỉnh</h2>'
    +'<div class="muted" style="margin-bottom:10px">Cứ đạt <b>[ngưỡng]</b> của <b>[chỉ số]</b> trong ngày → cộng <b>[số lượt]</b>. Có thể kết hợp nhiều điều kiện cùng lúc (cộng dồn).</div>'
    +'<div id="wheel-rules-list"></div>'
    +'<button onclick="addWheelRuleRow()" style="margin-top:6px">+ Thêm điều kiện</button><br>'
    +'<button onclick="saveWheelConfig('+(cfg?cfg.id:'null')+')" style="margin-top:10px">Lưu cấu hình</button></div>'
    +'<div class="card"><h2>Danh sách phần thưởng vòng quay</h2>'
    +(session?('<table><tr><th>Tên</th><th>Trọng số</th><th></th></tr>'
      +entries.map(function(e){return '<tr><td>'+e.label+'</td><td>'+e.weight+'</td><td><button class="danger" onclick="deleteWheelEntry('+e.id+')">Xoá</button></td></tr>';}).join('')
      +'</table>'):'<div class="muted">Chưa có session — bấm nút bên dưới để tạo</div>')
    +'<div class="row" style="margin-top:12px"><input id="wheel-entry-label" placeholder="Tên phần thưởng"><input id="wheel-entry-weight" type="number" value="1" style="width:60px" placeholder="Trọng số">'
    +'<button onclick="addWheelEntry('+(session?session.id:'null')+')">'+(session?'Thêm phần thưởng':'Tạo session + thêm')+'</button></div>'
    +'</div>';
  renderWheelRulesList();
}
function renderWheelRulesList(){
  const el=document.getElementById('wheel-rules-list');
  if(!el)return;
  el.innerHTML=wheelRulesDraft.map(function(r,i){
    return '<div class="row" style="align-items:center">'
      +'<select onchange="wheelRulesDraft['+i+'].metric=this.value">'
      +METRIC_OPTIONS.map(function(m){return '<option value="'+m.value+'"'+(r.metric===m.value?' selected':'')+'>'+m.label+'</option>';}).join('')
      +'</select>'
      +'<span class="muted">cứ mỗi</span>'
      +'<input type="number" value="'+r.per_unit+'" style="width:70px" onchange="wheelRulesDraft['+i+'].per_unit=parseFloat(this.value)||1">'
      +'<span class="muted">→ +</span>'
      +'<input type="number" value="'+(r.credits||1)+'" style="width:60px" onchange="wheelRulesDraft['+i+'].credits=parseFloat(this.value)||1">'
      +'<span class="muted">lượt</span>'
      +'<button class="danger" onclick="removeWheelRuleRow('+i+')">Xoá</button>'
      +'</div>';
  }).join('')||'<div class="muted">Chưa có điều kiện nào — thêm ít nhất 1 để sale nhận được lượt quay</div>';
}
function addWheelRuleRow(){
  wheelRulesDraft.push({metric:'calls_answered',per_unit:10,credits:1});
  renderWheelRulesList();
}
function removeWheelRuleRow(i){
  wheelRulesDraft.splice(i,1);
  renderWheelRulesList();
}
async function saveWheelConfig(cfgId){
  const body={metric_rules:wheelRulesDraft,is_active:true};
  if(cfgId)await fWrite('game_wheel_config?id=eq.'+cfgId,'PATCH',body);
  else await fWrite('game_wheel_config','POST',body);
  alert('Đã lưu');renderWheel();
}
async function addWheelEntry(sessionId){
  const label=document.getElementById('wheel-entry-label').value;
  const weight=parseFloat(document.getElementById('wheel-entry-weight').value)||1;
  if(!label){alert('Nhập tên phần thưởng');return;}
  if(!sessionId){
    const created=await fWrite('wheel_sessions','POST',{name:'Sale Game Wheel',purpose:'Vòng quay may mắn cho sale',is_sale_game:true,is_active:true});
    if(!Array.isArray(created)||!created[0]){
      alert('Lỗi tạo session vòng quay: '+(created&&created.error?created.error:'không rõ nguyên nhân — mở Console (F12) xem chi tiết'));
      return;
    }
    sessionId=created[0].id;
  }
  const entryRes=await fWrite('wheel_entries','POST',{session_id:sessionId,label:label,weight:weight,is_active:true});
  if(!Array.isArray(entryRes)){
    alert('Lỗi thêm phần thưởng: '+(entryRes&&entryRes.error?entryRes.error:'không rõ nguyên nhân — mở Console (F12) xem chi tiết'));
    return;
  }
  renderWheel();
}
async function deleteWheelEntry(id){
  if(!confirm('Xoá phần thưởng này?'))return;
  await fWrite('wheel_entries?id=eq.'+id,'DELETE',{});
  renderWheel();
}

// ═══ 4. HỘP BÍ MẬT ═══
let boxTiersDraft=[];
async function renderBox(){
  const el=document.getElementById('tab-box');
  el.innerHTML='Đang tải...';
  const thisMonth=new Date().toISOString().slice(0,7);
  const configs=await fRead('game_box_config?period_key=eq.'+thisMonth+'&order=id.desc&limit=1');
  const cfg=configs[0];
  const boxes=cfg?await fRead('game_boxes?config_id=eq.'+cfg.id+'&order=sort_order'):[];
  boxTiersDraft=cfg&&cfg.tier_json&&cfg.tier_json.length?cfg.tier_json.map(function(t){return {min_value:t.min_value??t.min_pct,draws:t.draws};}):[{min_value:50,draws:1},{min_value:75,draws:2},{min_value:100,draws:3}];

  el.innerHTML='<div class="card"><h2>Đợt hộp bí mật tháng '+thisMonth+'</h2>'
    +(cfg?'<div class="muted">Đã tạo — config id '+cfg.id+'</div>':'<button onclick="createBoxConfig(\''+thisMonth+'\')">Tạo đợt mới</button>')
    +'</div>'
    +(cfg?('<div class="card"><h2>Cấu hình bậc thang lượt bốc thăm</h2>'
      +'<div class="row"><label>Chỉ số dùng để tính bậc:</label><select id="box-metric">'
      +METRIC_BOX_OPTIONS.map(function(m){return '<option value="'+m.value+'"'+(cfg.metric===m.value?' selected':'')+'>'+m.label+'</option>';}).join('')
      +'</select></div>'
      +'<div class="muted" style="margin:8px 0">Đạt đủ ngưỡng nào thì nhận đúng số lượt của bậc đó (không cộng dồn — lấy bậc cao nhất đã đạt).</div>'
      +'<div id="box-tiers-list"></div>'
      +'<button onclick="addBoxTierRow()" style="margin-top:6px">+ Thêm bậc</button><br>'
      +'<div class="row" style="margin-top:12px"><label>Hộp an ủi — từ:</label><input id="box-cons-min" type="number" value="'+(cfg.consolation_min_value??cfg.consolation_min_pct??30)+'" style="width:70px">'
      +'<label>đến:</label><input id="box-cons-max" type="number" value="'+(cfg.consolation_max_value??cfg.consolation_max_pct??49)+'" style="width:70px"></div>'
      +'<button onclick="saveBoxTiers('+cfg.id+')" style="margin-top:10px">Lưu cấu hình bậc thang</button>'
      +'</div>'):'')
    +(cfg?('<div class="card"><h2>Danh sách hộp ('+boxes.length+')</h2><table><tr><th>Loại</th><th>Tên quà</th><th>Đã bốc?</th><th></th></tr>'
      +boxes.map(function(b){return '<tr><td>'+(b.box_type==='consolation'?'An ủi':'Thường')+'</td><td>'+b.prize_title+'</td><td>'+(b.is_drawn?'✅':'—')+'</td><td>'+(b.is_drawn?'':'<button class="danger" onclick="deleteBox('+b.id+')">Xoá</button>')+'</td></tr>';}).join('')
      +'</table>'
      +'<div class="row" style="margin-top:12px">'
      +'<select id="box-type"><option value="normal">Thường</option><option value="consolation">An ủi</option></select>'
      +'<input id="box-title" placeholder="Tên phần thưởng"><input id="box-note" placeholder="Ghi chú">'
      +'<button onclick="addBox('+cfg.id+')">Thêm hộp</button></div></div>'):'');
  if(cfg)renderBoxTiersList();
}
const METRIC_BOX_OPTIONS=[
  {value:'target_pct',label:'% đạt target tháng (mặc định cũ)'},
  {value:'orders_closed',label:'Số đơn chốt trong kỳ'},
  {value:'revenue_amount',label:'Doanh số ($) trong kỳ'},
  {value:'calls_answered',label:'Số cuộc "Bắt máy" trong kỳ'},
];
function renderBoxTiersList(){
  const el=document.getElementById('box-tiers-list');
  if(!el)return;
  el.innerHTML=boxTiersDraft.map(function(t,i){
    return '<div class="row"><span class="muted">Đạt từ</span>'
      +'<input type="number" value="'+t.min_value+'" style="width:80px" onchange="boxTiersDraft['+i+'].min_value=parseFloat(this.value)||0">'
      +'<span class="muted">→</span>'
      +'<input type="number" value="'+t.draws+'" style="width:60px" onchange="boxTiersDraft['+i+'].draws=parseInt(this.value)||1">'
      +'<span class="muted">lượt</span>'
      +'<button class="danger" onclick="removeBoxTierRow('+i+')">Xoá</button></div>';
  }).join('');
}
function addBoxTierRow(){boxTiersDraft.push({min_value:0,draws:1});renderBoxTiersList();}
function removeBoxTierRow(i){boxTiersDraft.splice(i,1);renderBoxTiersList();}
async function saveBoxTiers(cfgId){
  const metric=document.getElementById('box-metric').value;
  const consMin=parseFloat(document.getElementById('box-cons-min').value)||0;
  const consMax=parseFloat(document.getElementById('box-cons-max').value)||0;
  await fWrite('game_box_config?id=eq.'+cfgId,'PATCH',{
    metric:metric,tier_json:boxTiersDraft,
    consolation_min_value:consMin,consolation_max_value:consMax,
  });
  alert('Đã lưu');renderBox();
}
async function createBoxConfig(periodKey){
  const tiers=[{min_value:50,draws:1},{min_value:75,draws:2},{min_value:100,draws:3}];
  await fWrite('game_box_config','POST',{period_type:'month',period_key:periodKey,metric:'target_pct',tier_json:tiers,consolation_min_value:30,consolation_max_value:49,is_active:true});
  renderBox();
}
async function addBox(configId){
  const boxType=document.getElementById('box-type').value;
  const title=document.getElementById('box-title').value;
  const note=document.getElementById('box-note').value;
  if(!title){alert('Nhập tên phần thưởng');return;}
  await fWrite('game_boxes','POST',{config_id:configId,box_type:boxType,prize_title:title,prize_note:note});
  renderBox();
}
async function deleteBox(id){
  if(!confirm('Xoá hộp này?'))return;
  await fWrite('game_boxes?id=eq.'+id,'DELETE',{});
  renderBox();
}

// ═══ 5. ĐẤU GIÁ ═══
async function renderAuction(){
  const el=document.getElementById('tab-auction');
  el.innerHTML='Đang tải...';
  const q=Math.ceil((new Date().getMonth()+1)/3);
  const periodKey=new Date().getFullYear()+'-Q'+q;
  const items=await fRead('game_auction_items?period_key=eq.'+periodKey+'&order=id.desc');
  const profiles=await getProfiles();

  const itemsHtml=await Promise.all(items.map(async function(it){
    const bids=await fRead('game_auction_bids?item_id=eq.'+it.id+'&order=bid_points.desc');
    const topBid=bids[0];
    return '<div class="card"><div class="row"><b>'+it.title+'</b><span class="badge '+it.status+'">'+(it.status==='open'?'Đang mở':'Đã đóng')+'</span></div>'
      +'<div class="muted">'+(it.description||'')+' — Khởi điểm: '+it.starting_points+' điểm</div>'
      +(topBid?('<div>Giá cao nhất: <b>'+topBid.bid_points+'</b> điểm — '+profName(topBid.user_id,profiles)+'</div>'):'<div class="muted">Chưa có ai đặt giá</div>')
      +(it.status==='open'?('<button class="danger" onclick="closeAuctionItem('+it.id+')">Đóng phiên & chốt người thắng</button>'):('<div class="muted">Người thắng: '+(it.winner_user_id?profName(it.winner_user_id,profiles):'không có')+' — '+(it.final_points||0)+' điểm</div>'))
      +'</div>';
  }));

  el.innerHTML='<div class="card"><h2>Tạo phiên đấu giá mới — '+periodKey+'</h2>'
    +'<div class="row"><input id="auction-title" placeholder="Tên quà"><input id="auction-desc" placeholder="Mô tả"><input id="auction-start" type="number" placeholder="Điểm khởi điểm" style="width:120px"></div>'
    +'<button onclick="createAuctionItem(\''+periodKey+'\')">Tạo phiên</button></div>'
    +itemsHtml.join('');
}
async function createAuctionItem(periodKey){
  const title=document.getElementById('auction-title').value;
  const desc=document.getElementById('auction-desc').value;
  const start=parseFloat(document.getElementById('auction-start').value)||0;
  if(!title||start<=0){alert('Nhập đủ tên + điểm khởi điểm');return;}
  await fWrite('game_auction_items','POST',{period_key:periodKey,title:title,description:desc,starting_points:start,status:'open'});
  renderAuction();
}
async function closeAuctionItem(itemId){
  if(!confirm('Đóng phiên này? Không thể mở lại.'))return;
  // callerUserId cần là 1 manager thật — Calvin tự thay bằng đúng user_id của mình nếu cần thiết
  const res=await callAction('close_auction',{user_id:CALVIN_USER_ID,item_id:itemId});
  if(!res.ok){alert(res.error||'Lỗi đóng phiên');return;}
  alert('Đã đóng — người thắng: '+(res.winner_user_id||'không có'));
  renderAuction();
}

const CALVIN_USER_ID='c5e92fdc-b546-4674-846b-a994ef0ee71e';

switchTab('contest');
</script>
